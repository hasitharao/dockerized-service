name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name (GHCR requires lowercase)
        id: vars
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.name }}:${{ github.sha }}
            ${{ steps.vars.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_MESSAGE: ${{ secrets.SECRET_MESSAGE }}
          APP_USERNAME: ${{ secrets.USERNAME }}
          APP_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          set -euo pipefail

          # 1. Write runtime config via stdin (never on a command line)
          {
            printf 'SECRET_MESSAGE=%s\n' "$SECRET_MESSAGE"
            printf 'USERNAME=%s\n' "$APP_USERNAME"
            printf 'PASSWORD=%s\n' "$APP_PASSWORD"
          } | ssh "$TARGET" 'umask 077; mkdir -p ~/app; cat > ~/app/.env'

          # 2. Short-lived registry login (token dies when this job ends)
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

          # 3. Pull, swap container, verify health
          ssh "$TARGET" "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          docker pull "$IMAGE"
          docker rm -f app >/dev/null 2>&1 || true
          docker run -d --name app --restart unless-stopped \
            --env-file "$HOME/app/.env" -p 80:3000 "$IMAGE"
          docker logout ghcr.io
          for i in $(seq 1 10); do
            if curl -fsS http://localhost/healthz >/dev/null; then
              echo "Deployed $IMAGE"
              docker image prune -af --filter "until=72h" >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed" >&2
          docker logs --tail 50 app
          exit 1
          REMOTE
